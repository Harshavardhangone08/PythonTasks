<!-- 🛡️ ADD / EDIT BOOK DETAILS MODAL POPUP -->
<div id="book-modal-container" class="fixed inset-0 bg-black/80 z-50 backdrop-blur-sm hidden items-center justify-center p-4">
  <div class="glass-panel w-full max-w-md rounded-2xl overflow-hidden shadow-2xl relative">
    <div class="px-6 py-4 border-b border-white/10 flex justify-between items-center bg-black/30">
      <h3 class="font-serif-lux text-base font-bold text-[#c4a47c]" id="book-modal-title">Register New Book</h3>
      <button onclick="closeBookModal()" class="text-slate-400 hover:text-white p-1 hover:bg-white/5 rounded-lg transition-all cursor-pointer">
        <i data-lucide="x" class="h-5 w-5"></i>
      </button>
    </div>

    <form id="book-form" onsubmit="handleBookFormSubmit(event)" class="p-6 space-y-4">
      <input type="hidden" id="book-id-input">
      
      <div class="space-y-1.5">
        <label class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Book Title</label>
        <input type="text" id="book-title-input" required placeholder="e.g. Neuromancer" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Author</label>
        <input type="text" id="book-author-input" required placeholder="e.g. William Gibson" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Genre Classification</label>
        <select id="book-genre-input" required class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-slate-200">
          <option value="Sci-Fi">Sci-Fi</option>
          <option value="Dystopian">Dystopian</option>
          <option value="Fiction">Fiction</option>
          <option value="Classic">Classic</option>
          <option value="Cyberpunk">Cyberpunk</option>
          <option value="Fantasy">Fantasy</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Price (₹)</label>
          <input type="number" id="book-price-input" min="1" required placeholder="e.g. 450" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
        </div>
        <div class="space-y-1.5">
          <label class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Inventory Stock Size</label>
          <input type="number" id="book-qty-input" min="1" required placeholder="e.g. 5" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
        </div>
      </div>

      <div class="pt-4 flex items-center justify-end gap-3.5 border-t border-white/5">
        <button type="button" onclick="closeBookModal()" class="px-4.5 py-2.5 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-semibold text-slate-300 uppercase">
          Cancel
        </button>
        <button type="submit" class="px-5 py-2.5 bg-[#c4a47c] hover:bg-[#b08e62] text-black font-semibold rounded-xl text-xs uppercase cursor-pointer">
          Save Records
        </button>
      </div>
    </form>
  </div>
</div>
