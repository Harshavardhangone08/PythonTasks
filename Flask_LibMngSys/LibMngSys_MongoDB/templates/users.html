<!-- Tab 3: REGISTERED READERS DIRECTORY VIEW -->
<div id="tab-users" class="tab-content space-y-6">
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Registration form on Left -->
    <div class="lg:col-span-4">
      <div class="glass-panel p-6 rounded-2xl space-y-4">
        <h3 class="font-serif-lux text-base font-bold text-[#c4a47c] flex items-center gap-2">
          <i data-lucide="user-plus" class="h-4.5 w-4.5"></i>
          Reader registration
        </h3>
        <p class="text-xs text-slate-400 leading-relaxed">
          Add an individual reader profile into the local library relational schema. Registered users immediately become eligible to draw books catalog assets.
        </p>

        <form id="add-user-form" onsubmit="handleAddUser(event)" class="space-y-4 pt-2">
          <div class="space-y-1.5">
            <label class="text-[10px] text-slate-400 tracking-widest font-mono">Reader full name</label>
            <input type="text" id="user-name-input" required placeholder="e.g. Harsha Vardhan" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
          </div>

          <div class="space-y-1.5">
            <label class="text-[10px] text-slate-400 tracking-widest font-mono">Email address</label>
            <input type="email" id="user-email-input" required placeholder="e.g. harshagenius@gmail.com" class="w-full bg-[#101014] border border-white/10 rounded-xl px-4 py-3 text-xs text-white">
          </div>

          <button type="submit" class="w-full py-3 bg-[#c4a47c] hover:bg-[#b08e62] text-black font-semibold rounded-xl text-xs tracking-wider transition-all cursor-pointer">
            Complete registration
          </button>
        </form>
      </div>
    </div>

    <!-- Directory table layout on Right -->
    <div class="lg:col-span-8">
      <div class="glass-panel rounded-2xl overflow-hidden">
        <div class="px-6 py-4.5 bg-black/30 border-b border-white/5 flex items-center justify-between">
          <h3 class="text-xs tracking-widest font-mono text-slate-400 font-bold">Standard readers listing</h3>
          <span class="text-[10px] bg-white/5 text-slate-400 px-2 py-0.5 rounded" id="user-count-badge">0 Profiles</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-white/10 bg-black/20 text-[10px] font-mono tracking-widest text-[#c4a47c]">
                <th class="py-4.5 px-6">ID & name</th>
                <th class="py-4.5 px-6">Registered email address</th>
                <th class="py-4.5 px-6 text-right">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-white/5 text-xs text-slate-200" id="users-table-body">
              <!-- Users table content -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
