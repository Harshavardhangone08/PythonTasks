{% extends 'base.html' %}

{% block content %}

<div class="form-container">

    <h2 style="margin-bottom:30px;">
        <i class="fa fa-user-plus"></i>
        Add New User
    </h2>

    <form method="POST">

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input type="text"
            name="name"
            class="form-control"
            placeholder="Enter full name"
            required>

        </div>

        <div class="form-group">

            <label>
                Email Address
            </label>

            <input type="email"
            name="email"
            class="form-control"
            placeholder="Enter email"
            required>

        </div>

        <button class="btn btn-success">
            <i class="fa fa-save"></i>
            Add User
        </button>

    </form>

</div>

{% endblock %}
