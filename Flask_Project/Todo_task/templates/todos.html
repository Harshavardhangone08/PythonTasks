<html>
<head>
    <title>Todo Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="todo-container">

        <!-- Header -->

        <div class="top-bar">

            <div>
                <h1>My Tasks</h1>
                <p>Manage your daily workflow efficiently</p>
            </div>

            <a href="/">
                <button class="home-btn">
                    Home
                </button>
            </a>

        </div>

        <!-- Add Todo -->

        <form action="/add" method="POST" class="todo-form">

            <input type="text"
                   name="task"
                   placeholder="Enter a new task"
                   required>

            <button type="submit" class="add-btn">
                Add Task
            </button>

        </form>

        <!-- Todo Cards -->

        {% for todo in todos %}

        <div class="todo-card">

            <!-- Update Form -->
            <form action="/update/{{ todo.id }}"
                  method="POST"
                  class="task-section">

                <input type="text"
                       name="updated_task"
                       value="{{ todo.task }}"
                       class="task-input"
                       id="task-{{ todo.id }}"
                       readonly>

                <div class="action-buttons">

                    <button type="button"
                            class="update-btn"
                            onclick="enableEdit({{ todo.id }})">

                        Update
                    </button>

                    <button type="submit"
                            class="save-btn">

                        Save
                    </button>

                    <button type="button"
                            class="delete-btn"
                            onclick="confirmDelete({{ todo.id }})">

                        Delete

                    </button>

                </div>
            </form>
        </div>

        {% endfor %}

    </div>


    <!-- Delete Confirmation Modal -->

    <div class="modal" id="deleteModal">

        <div class="modal-content">

            <h2>Delete Task</h2>

            <p>
                Are you sure you want to delete this task?
            </p>

            <div class="modal-buttons">

                <button class="cancel-btn"
                        onclick="closeModal()">

                    Cancel
                </button>

                <a id="deleteLink">
                    <button class="confirm-delete-btn">
                        Delete
                    </button>
                </a>
            </div>
        </div>
    </div>


    <!-- JavaScript -->
    <script>

        function enableEdit(id){

            document.getElementById(
                "task-" + id
            ).removeAttribute("readonly");
        }

        function confirmDelete(id){

            document.getElementById(
                "deleteModal"
            ).style.display = "flex";

            document.getElementById(
                "deleteLink"
            ).href = "/delete/" + id;
        }

        function closeModal(){

            document.getElementById(
                "deleteModal"
            ).style.display = "none";
        }
    </script>
</body>
</html>
