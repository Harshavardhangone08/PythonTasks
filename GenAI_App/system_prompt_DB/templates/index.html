<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Library Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.main-container{
    width:100%;
    max-width:1100px;
    height:90vh;

    backdrop-filter:blur(20px);
    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:25px;
    overflow:hidden;

    display:flex;
    flex-direction:column;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);
}

.header{

    padding:25px;

    background:rgba(255,255,255,0.08);

    border-bottom:1px solid rgba(255,255,255,0.1);

    display:flex;
    align-items:center;
    gap:15px;
}

.logo{

    width:55px;
    height:55px;

    border-radius:50%;

    background:linear-gradient(135deg,#38bdf8,#6366f1);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:24px;
}

.header-text h1{
    color:white;
    font-size:24px;
}

.header-text p{
    color:#cbd5e1;
    font-size:14px;
}

.chat-box{
    flex:1;
    overflow-y:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.message{
    max-width:75%;
    padding:14px 18px;
    border-radius:18px;
    line-height:1.6;
    animation:fadeIn .4s ease;
}

.user{
    align-self:flex-end;
    background:#4f46e5;
    color:white;
}

.bot{
    align-self:flex-start;
    background:rgba(255,255,255,0.1);
    color:white;
    border:1px solid rgba(255,255,255,0.1);
}

.input-area{
    padding:20px;
    border-top:1px solid rgba(255,255,255,0.1);
    display:flex;
    gap:12px;
}

textarea{
    flex:1;
    resize:none;
    height:60px;

    border:none;
    outline:none;

    border-radius:15px;
    padding:15px;

    background:rgba(255,255,255,0.08);
    color:white;
    font-size:15px;
}

textarea::placeholder{
    color:#cbd5e1;
}

button{

    width:140px;

    border:none;
    border-radius:15px;

    cursor:pointer;

    background:linear-gradient(
    135deg,
    #3b82f6,
    #6366f1
    );

    color:white;
    font-size:15px;
    font-weight:600;

    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
}

.typing{

    display:flex;
    gap:6px;
    padding:15px;
}

.typing span{

    width:10px;
    height:10px;

    border-radius:50%;
    background:white;

    animation:bounce 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.2s;
}

.typing span:nth-child(3){
    animation-delay:.4s;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-8px);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#64748b;
    border-radius:20px;
}

</style>
</head>

<body>

<div class="main-container">

    <div class="header">

        <div class="logo">
            📚
        </div>

        <div class="header-text">
            <h1>AI Library Assistant</h1>
            <p>Powered by FastAPI + LLM</p>
        </div>

    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            👋 Welcome! Ask me anything about books,
            library resources, recommendations,
            summaries, or research topics.
        </div>

    </div>

    <div class="input-area">

        <textarea
        id="question"
        placeholder="Ask your question..."
        ></textarea>

        <button onclick="askAI()">
            Send
        </button>

    </div>

</div>

<script>

const chatBox =
document.getElementById("chatBox");

function addMessage(text,type){

    const div =
    document.createElement("div");

    div.className =
    `message ${type}`;

    div.innerHTML = text;

    chatBox.appendChild(div);

    chatBox.scrollTop =
    chatBox.scrollHeight;
}

async function askAI(){

    const question =
    document.getElementById("question").value.trim();

    if(!question) return;

    addMessage(question,"user");

    document.getElementById("question").value="";

    const loader =
    document.createElement("div");

    loader.className="message bot";

    loader.innerHTML=`
        <div class="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>
    `;

    chatBox.appendChild(loader);

    chatBox.scrollTop =
    chatBox.scrollHeight;

    const formData =
    new FormData();

    formData.append(
        "question",
        question
    );

    const response =
    await fetch(
        "/ask-ai",
        {
            method:"POST",
            body:formData
        }
    );

    const data =
    await response.json();

    loader.remove();

    addMessage(
        data.answer,
        "bot"
    );
}

document
.getElementById("question")
.addEventListener(
"keydown",
function(e){

    if(e.key==="Enter" && !e.shiftKey){

        e.preventDefault();
        askAI();
    }
});

</script>

</body>
</html>
